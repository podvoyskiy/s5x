[package]
name = "s5t"
version = "0.2.2"
description = "SOCKS5 client with tun2socks and one-time request modes"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

s5l = { workspace = true }

tokio-util = "0.7.18"
is_sudo = "0.0.2"
futures = "0.3.34"

# TLS support for HTTPS
tokio-rustls = "0.26.4"
rustls = "0.23.40"
webpki-roots = "1.0.7"

# TUN device
tun = { version = "0.8.11", features = ["async"] }

# Routing (Linux)
netlink-packet-route = "0.31.0"
netlink-packet-core = "0.8.1"
netlink-sys = "0.8.8"
iptables = "0.6.0"

# DNS
hickory-proto = "0.26.1"

# Network stack (tun2socks)
netstack-smoltcp = "0.2.4"
futures-util = "0.3.34"

[[bin]]
name = "s5t"
path = "src/main.rs"
test = true

[[test]]
name = "client"
path = "../tests/client.rs"
